[project]
name = "shakespeare-rag"
version = "0.1.0"
description = "Shakespeare RAG: ask questions about Shakespeare's plays and poems with LangChain, FAISS and OpenAI"
readme = "README.md"
authors = [
    { name = "Taniket Mehra", email = "taniket.mehra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "faiss-cpu>=1.13.0",
    "jq>=1.12.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pymupdf>=1.26.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "unstructured>=0.18.3",
]

[tool.uv]
package = false  # an app run with streamlit/python, not an installable library
