[project]
name = "rag-with-langchain"
version = "0.1.0"
description = "Retrieval-augmented generation over local documents with LangChain, FAISS and OpenAI"
readme = "README.md"
authors = [
    { name = "Taniket Mehra", email = "taniket.mehra@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.13.0",
    "ipykernel>=6.31.0",
    "jq>=1.12.0",
    "langchain>=0.3.30",
    "langchain-community>=0.3.31",
    "langchain-core>=0.3.86",
    "langchain-openai>=0.3.35",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pymupdf>=1.26.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.1.2",
    "unstructured>=0.18.3",
]

[project.scripts]
rag-with-langchain = "rag_with_langchain:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
